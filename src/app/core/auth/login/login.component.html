<mat-card class="login-card">
  <div class="login-header">
    <img src="assets/img/logo.png" alt="logo" class="login-logo">
    <mat-card-title>Iniciar sesión</mat-card-title>
    <p class="login-subtitle">Accede a la plataforma de gestión</p>
  </div>
  <mat-card-content>
    <button mat-flat-button class="btn-login" type="button" (click)="loginWithPeakAuth()">
      Iniciar sesión con Peak Auth
    </button>
  </mat-card-content>
</mat-card>
