<mat-card class="login-card">
  <mat-card-title>{{title}}</mat-card-title>
        <mat-card-content>
          @if(isTokenFlow){
            <p class="text">
              {{message}}
            </p>
            <div class="login_signup">
                <a (click)="goLogin()" class="link">Iniciar sesión</a>
            </div>
          }
        </mat-card-content>
</mat-card>
