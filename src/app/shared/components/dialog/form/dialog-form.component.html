<h2 mat-dialog-title>Crea tu {{ entityName }}</h2>
<mat-dialog-content>
  <form class="form" [formGroup]="entityForm">
        <mat-form-field class="w100" appearance="outline">
          <mat-label>Nombre de la {{ entityName | lowercase }}</mat-label>
          <input type="text" matInput formControlName="name">
            @if(name.hasError('required') && name.touched) {
              <mat-error>
                El nombre es <strong>requerido</strong>
              </mat-error>
            }

            @if(name.hasError('maxlength') && name.touched) {
              <mat-error>
                El nombre excede los <strong>65 caracteres</strong>
              </mat-error>
            }
        </mat-form-field>
      </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="save()" [disabled]="!entityForm.valid">Guardar</button>
  <button mat-button (click)="cancel()">Cancelar</button>
</mat-dialog-actions>
