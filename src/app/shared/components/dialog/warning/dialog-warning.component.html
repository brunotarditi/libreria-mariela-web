<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <div class="message">
    {{data.message}}
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button class="btn-dialog-save" type="button" mat-flat-button (click)="save()">Confirmar</button>
  <button class="btn-dialog-cancel" type="button" mat-stroked-button (click)="cancel()">Cancelar</button>
</mat-dialog-actions>
