<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <div class="message">
    @if (data.itemName) {
      ¿Estás seguro de que deseas eliminar <strong>"{{ data.itemName }}"</strong>?
      <p class="warning-subtext">Esta acción no se puede deshacer.</p>
    } @else {
      {{ data.message }}
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button class="btn-dialog-save" [class.btn-destructive]="data.isDestructive" type="button" mat-flat-button (click)="save()">
    {{ data.isDestructive ? 'Eliminar' : 'Confirmar' }}
  </button>
  <button class="btn-dialog-cancel" type="button" mat-stroked-button (click)="cancel()">Cancelar</button>
</mat-dialog-actions>
