<app-breadcrumb [breadcrumbs]="breadcrumbs"></app-breadcrumb>

<app-crud-table
  title="Categorías"
  icon="category"
  searchLabel="Buscar categoría"
  searchPlaceholder="Ejemplo: Reglas"
  entityName="categoría"
  createRoute="/categories/detail/create"
  editRoutePrefix="/categories/detail"
  [columns]="columns"
  [data]="categories()"
  [isLoading]="isLoading()"
  (deleteConfirmed)="onDelete($event)"
  (bulkDeleteConfirmed)="onBulkDelete($event)">
</app-crud-table>
