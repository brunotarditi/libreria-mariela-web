<app-crud-table
  title="Marcas"
  icon="local_offer"
  searchLabel="Buscar marca"
  searchPlaceholder="Ejemplo: Bic"
  entityName="marca"
  createRoute="/brands/detail/create"
  editRoutePrefix="/brands/detail"
  [columns]="columns"
  [data]="brands()"
  [isLoading]="isLoading()"
  (deleteConfirmed)="onDelete($event)"
  (bulkDeleteConfirmed)="onBulkDelete($event)">
</app-crud-table>
