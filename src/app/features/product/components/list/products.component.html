<app-title [title]="'Productos'" [icon]="'store'"></app-title>
<mat-form-field class="mt-10">
  <mat-label>Buscar producto</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ejemplo: Lapicera" #input>
</mat-form-field>

<div class="mat-elevation-z8 mb-10">
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Código </th>
      <td mat-cell *matCellDef="let row"> {{row.code}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
      <td mat-cell *matCellDef="let row"> {{row.name}} </td>
    </ng-container>

    <ng-container matColumnDef="profit_margin">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Margen de ganacia </th>
      <td mat-cell *matCellDef="let row">{{row.profit_margin}} %</td>
    </ng-container>

        <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Descripción </th>
      <td mat-cell *matCellDef="let row"> {{row.description}} </td>
    </ng-container>

        <ng-container matColumnDef="brand_name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Marca </th>
      <td mat-cell *matCellDef="let row"> {{row.brand_name}} </td>
    </ng-container>

        <ng-container matColumnDef="category_name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Categoría </th>
      <td mat-cell *matCellDef="let row"> {{row.category_name}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <button mat-mini-fab class="btn-action" matTooltip="Eliminar categoría" matTooltipPosition="above" (click)="onDelete(row.ID)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No hay información de la búsqueda "{{input.value}}"</td>
    </tr>
  </table>

  <mat-paginator
      [pageSizeOptions]="[5, 10, 25, 100]"
      aria-label="Selecciona la página de productos">
  </mat-paginator>
</div>
