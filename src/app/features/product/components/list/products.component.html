<app-breadcrumb [breadcrumbs]="breadcrumbs"></app-breadcrumb>

<app-crud-table
  title="Productos"
  icon="store"
  searchLabel="Buscar productos"
  searchPlaceholder="Ejemplo: Lapicera"
  entityName="producto"
  createRoute="/products/detail/create"
  editRoutePrefix="/products/detail"
  [columns]="columns"
  [data]="products()"
  [isLoading]="isLoading()"
  (deleteConfirmed)="onDelete($event)"
  (bulkDeleteConfirmed)="onBulkDelete($event)">
</app-crud-table>
